name: Build Ambient Composer AI

# Builds real Windows binaries on an actual Windows machine (MSVC), runs the
# test suite + pluginval, packages a one-click installer, and uploads it as a
# downloadable artifact. Pushing a version tag (e.g. v1.0.0) also publishes a
# GitHub Release with the installer attached so it can be shared via a link.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:      # lets you run it manually from the Actions tab

# The release step needs write access to publish the installer on tags.
permissions:
  contents: write

jobs:
  windows:
    name: Windows (VST3 + Standalone + Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + fetch JUCE)
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run engine test suite
        run: .\build\AmbientComposerTests_artefacts\Release\AmbientComposerTests.exe

      - name: Download pluginval
        run: |
          curl.exe -L -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          tar.exe -xf pluginval.zip
        shell: pwsh

      # Informational QA — never blocks the installer (the engine tests are the gate).
      - name: Validate VST3 with pluginval
        continue-on-error: true
        run: .\pluginval.exe --strictness-level 5 --validate "build\AmbientComposerAI_artefacts\Release\VST3\Ambient Composer AI.vst3"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\AmbientComposerAI.iss'
        shell: pwsh

      - name: Upload installer (download this and send it to your friend)
        uses: actions/upload-artifact@v4
        with:
          name: AmbientComposerAI-Windows-Installer
          path: installer\Output\AmbientComposerAI-Setup.exe
          if-no-files-found: error

      - name: Upload portable build (zip fallback — no installer)
        uses: actions/upload-artifact@v4
        with:
          name: AmbientComposerAI-Windows-Portable
          path: |
            build/AmbientComposerAI_artefacts/Release/VST3/**
            build/AmbientComposerAI_artefacts/Release/Standalone/**

      - name: Publish GitHub Release (on version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\AmbientComposerAI-Setup.exe
          name: Ambient Composer AI ${{ github.ref_name }}
          body: |
            Windows installer for Ambient Composer AI.
            Download **AmbientComposerAI-Setup.exe** below, run it, and click through —
            it installs the VST3 (for FL Studio) and the standalone app.

  # macOS is built + tested here too, for completeness (it already builds locally).
  macos:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Run engine test suite
        run: ./build/AmbientComposerTests_artefacts/Release/AmbientComposerTests
